name: Coq

on:
  push:
    branches: [main, new-idea]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPAMNOSELFUPGRADE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-base-compiler.5.2.1
          cache-prefix: ptree-local-profile-v1
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            coq-released: https://coq.inria.fr/opam/released

      # setup-ocaml bootstraps the switch using its bundled opam. All dependency
      # solves below use the local environment's exact opam frontend instead.
      - name: Select local opam version
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ptree-opam"
          curl --fail --location --retry 3 \
            https://github.com/ocaml/opam/releases/download/2.5.1/opam-2.5.1-x86_64-linux \
            --output "$RUNNER_TEMP/ptree-opam/opam"
          printf '%s  %s\n' \
            33705e328d9f740026ce182079e2457639791bcf04a0e4bafbdb2024dd4d6092 \
            "$RUNNER_TEMP/ptree-opam/opam" | sha256sum --check
          chmod +x "$RUNNER_TEMP/ptree-opam/opam"
          test "$("$RUNNER_TEMP/ptree-opam/opam" --version)" = 2.5.1
          echo "$RUNNER_TEMP/ptree-opam" >> "$GITHUB_PATH"

      # Install the constraint package itself, not just --deps-only: keeping it
      # installed prevents the later project solve from upgrading dependencies.
      # Dune and all transitive constraints apply BEFORE Coq/Elpi are built.
      - name: Install frozen local dependency profile
        run: opam install ./.github/ci/ptree-ci.opam -y

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Verify frozen toolchain and dependency versions
        run: python3 tools/check_ci_environment.py

      - name: Audit maintained sources
        run: |
          python3 tools/audit_architecture.py --aggregate-only
          if git grep -n -E '^[[:space:]]*(Admitted|admit)\.' -- '*.v'; then
            echo 'Maintained theories contain an unfinished proof.' >&2
            exit 1
          fi
          if git grep -n -E 'PTreeDefinitionNew|ShallowNew|\.bak' -- theories; then
            echo 'Maintained theories reference an obsolete artifact name.' >&2
            exit 1
          fi

      - name: Build all theories
        run: opam exec -- dune build

      - name: Audit architecture, API, soundness and assumptions
        run: |
          python3 tools/audit_architecture.py --check
          python3 tools/audit_api.py --surface-only
          python3 tools/audit_soundness.py --source-only
          python3 tools/audit_assumptions.py --check
          python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Recheck universe regression in the full-library context
        run: python3 tools/audit_api.py --surface-only --kernel
