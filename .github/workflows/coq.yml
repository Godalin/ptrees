name: Coq

on:
  push:
    branches: [main, new-idea]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OPAMNOSELFUPGRADE: "true"
      OPAMYES: "true"
      OPAMRETRIES: "5"
      OPAMJOBS: "2"
      OPAMERRLOGLEN: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Current-version audits intentionally require no old Git objects.
          fetch-depth: 1

      - name: Audit current source boundaries and contract inventory
        run: |
          python3 tools/audit_architecture.py --aggregate-only
          python3 tools/audit_api.py --surface-only
          python3 tools/audit_soundness.py --source-only
          python3 tools/audit_contracts.py --metadata-only

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential m4 pkg-config libgmp-dev unzip curl git rsync

      - name: Initialize fresh root with fixed opam and compiler
        shell: bash
        run: bash .github/ci/bootstrap.sh

      # Install the constraint package itself, not just --deps-only: keeping it
      # installed prevents the later project solve from upgrading dependencies.
      # Dune and all transitive constraints apply BEFORE Coq/Elpi are built.
      - name: Install frozen local dependency profile
        run: opam install ./.github/ci/ptree-ci.opam -y

      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      - name: Verify frozen toolchain and dependency versions
        run: python3 tools/check_ci_environment.py

      - name: Build all theories
        run: opam exec -- dune build

      - name: Audit compiled dependency graph
        run: python3 tools/audit_architecture.py --check

      - name: Test audit tools and extracted programs
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Check all safe compiled contract groups
        run: python3 -u tools/audit_contracts.py --gate S

      - name: Check isolated MathComp contracts (not universe-checked)
        run: python3 -u tools/audit_contracts.py --gate M

      - name: Recheck universe regression in the full-library context
        run: python3 tools/audit_api.py --surface-only --kernel
